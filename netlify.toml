[build.environment]
  # Las variables NEXT_PUBLIC_* son públicas por diseño: Next.js las inyecta
  # en el bundle del navegador, y Firebase/Sanity las usan desde el cliente.
  # El secrets scanner de Netlify las detecta como falsos positivos (el
  # prefijo "AIza" de las Firebase API keys dispara la alerta).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_APP_URL"
